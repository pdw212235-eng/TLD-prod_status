<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>전기공사 프로젝트 표준 프로세스</title>
<style>
/* ============================================================
   Tokens — index.html 과 동일 계열
   ============================================================ */
:root{
  --ground:#F2EFE8; --surface:#FBFAF7; --surface-2:#F6F3EC;
  --line:#E2DCCF; --line-soft:#ECE7DC;
  --ink:#2A2822; --ink-2:#565247; --muted:#8B8477;
  --accent:#B4552F; --accent-hover:#9B4726; --accent-soft:#F5E6DD;
  --danger:#A5322A; --danger-soft:#F6E1DE;
  --ok:#3F6B4C; --ok-bg:#E1EBE1;
  --run:#2A6DA8; --run-bg:#DEE9F2;
  --rev:#8A6415; --rev-bg:#F1E7D1;
  --idle:#79736A; --idle-bg:#E9E4DB;
  --shadow-1:0 1px 2px rgba(42,40,34,.06);
  --shadow-2:0 12px 40px rgba(42,40,34,.16);
  --r:10px; --r-sm:7px; --r-pill:999px;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Nanum Myeongjo',serif;
  --sans:Pretendard,'Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI','Malgun Gothic',system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#1B1A17; --surface:#232220; --surface-2:#2B2A26;
    --line:#3A382F; --line-soft:#2F2E28;
    --ink:#EAE6DC; --ink-2:#BCB7AB; --muted:#8D877B;
    --accent:#D97757; --accent-hover:#E68C6E; --accent-soft:#3A281F;
    --danger:#E0705F; --danger-soft:#3A2320;
    --ok:#96B08B; --ok-bg:#273024;
    --run:#85B7EA; --run-bg:#22303A;
    --rev:#D5AC5F; --rev-bg:#383021;
    --idle:#A29C90; --idle-bg:#2E2C27;
    --shadow-1:0 1px 2px rgba(0,0,0,.3); --shadow-2:0 12px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --ground:#1B1A17; --surface:#232220; --surface-2:#2B2A26;
  --line:#3A382F; --line-soft:#2F2E28;
  --ink:#EAE6DC; --ink-2:#BCB7AB; --muted:#8D877B;
  --accent:#D97757; --accent-hover:#E68C6E; --accent-soft:#3A281F;
  --danger:#E0705F; --danger-soft:#3A2320;
  --ok:#96B08B; --ok-bg:#273024;
  --run:#85B7EA; --run-bg:#22303A;
  --rev:#D5AC5F; --rev-bg:#383021;
  --idle:#A29C90; --idle-bg:#2E2C27;
  --shadow-1:0 1px 2px rgba(0,0,0,.3); --shadow-2:0 12px 40px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}

/* ---------- 헤더 ---------- */
header{
  position:sticky; top:0; z-index:100;
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:saturate(140%) blur(8px);
  border-bottom:1px solid var(--line);
}
.head-in{max-width:1400px;margin:0 auto;padding:10px 20px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.2;margin-right:4px}
.brand b{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:-.01em}
.brand span{font-size:11px;color:var(--muted)}
.grow{flex:1}

.btn{
  border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
  padding:6px 12px; border-radius:var(--r-sm); cursor:pointer; font-size:13px;
  transition:background .15s,border-color .15s,color .15s; white-space:nowrap;
}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:var(--danger-soft);border-color:var(--danger)}

select,input[type=text],input[type=date],input[type=url],textarea{
  border:1px solid var(--line); background:var(--surface); border-radius:var(--r-sm);
  padding:6px 10px; outline:none; max-width:100%;
}
select:focus,input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;width:100%;font-size:13px;line-height:1.5}

.seg{display:flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 13px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}

/* ---------- 레이아웃 ---------- */
.wrap{max-width:1400px;margin:0 auto;padding:22px 20px 90px;display:grid;grid-template-columns:250px 1fr;gap:26px;align-items:start}
@media (max-width:960px){ .wrap{grid-template-columns:1fr} nav.toc{position:static !important;max-height:none !important} }

/* ---------- 사이드 목차 ---------- */
nav.toc{position:sticky;top:74px;max-height:calc(100vh - 96px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;box-shadow:var(--shadow-1)}
nav.toc h4{margin:6px 6px 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
nav.toc a{display:block;text-decoration:none;color:var(--ink-2);padding:7px 9px;border-radius:var(--r-sm);font-size:13px}
nav.toc a:hover{background:var(--surface-2)}
nav.toc a.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.toc-row{display:flex;align-items:center;gap:8px}
.toc-no{width:19px;height:19px;flex:none;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center;font-size:10px;font-family:var(--mono);color:var(--muted);background:var(--surface-2)}
.toc-row.done .toc-no{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.toc-pc{margin-left:auto;font-size:11px;font-family:var(--mono);color:var(--muted)}
nav.toc hr{border:0;border-top:1px solid var(--line-soft);margin:9px 4px}

/* ---------- 카드 공통 ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-1)}
.pad{padding:18px 20px}

/* ---------- 프로젝트 헤더 ---------- */
.projbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.projbar .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.projbar .meta b{color:var(--muted);font-weight:500;margin-right:5px}

.bigbar{height:8px;border-radius:var(--r-pill);background:var(--surface-2);overflow:hidden;border:1px solid var(--line-soft)}
.bigbar i{display:block;height:100%;background:var(--accent);transition:width .35s}
.bigbar.full i{background:var(--ok)}

/* ---------- 단계 섹션 ---------- */
section.stage{scroll-margin-top:78px;margin-bottom:22px}
.stage-head{display:flex;gap:14px;align-items:flex-start;padding:16px 20px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.stage-no{width:34px;height:34px;flex:none;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);
  display:grid;place-items:center;font-family:var(--serif);font-size:16px;color:var(--ink-2)}
.stage.done .stage-no{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.stage-title{flex:1;min-width:0}
.stage-title h2{margin:0;font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:-.01em}
.stage-title p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.stage-pc{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;padding-top:5px}
.chev{color:var(--muted);transition:transform .2s;padding-top:6px}
.stage.collapsed .chev{transform:rotate(-90deg)}
.stage.collapsed .stage-body{display:none}

.gate{display:flex;gap:8px;align-items:center;padding:9px 20px;background:var(--surface-2);
  border-bottom:1px solid var(--line-soft);font-size:12.5px;color:var(--ink-2)}
.gate b{font-weight:600;color:var(--ink)}
.gate .tag{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--line);border-radius:var(--r-pill);padding:1px 8px;background:var(--surface)}
.gate.pass{background:var(--ok-bg)} .gate.pass .tag{color:var(--ok);border-color:var(--ok)}

.purpose{margin:0;padding:14px 20px 0;font-size:13.5px;color:var(--ink-2)}
.purpose b{color:var(--ink)}

/* ---------- 블록(체크리스트) ---------- */
.block{padding:14px 20px 4px}
.block h3{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.block.note{background:var(--danger-soft);margin:14px 20px 0;padding:12px 14px;border-radius:var(--r-sm)}
.block.note h3{color:var(--danger)}
.block.note ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.block.note li{margin:3px 0}

.chk{display:flex;gap:9px;align-items:flex-start;padding:5px 8px;border-radius:var(--r-sm);cursor:pointer}
.chk:hover{background:var(--surface-2)}
.chk input{margin:3px 0 0;width:15px;height:15px;flex:none;accent-color:var(--accent);cursor:pointer}
.chk span{font-size:13.5px;color:var(--ink-2)}
.chk input:checked+span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.star{color:var(--accent);font-size:11px;vertical-align:2px}

/* ---------- 표 ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
.tbl th,.tbl td{border:1px solid var(--line-soft);padding:7px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--surface-2);font-weight:600;font-size:12px;color:var(--ink-2)}
.tbl td.c{text-align:center;width:40px}
.scrollx{overflow-x:auto}

/* ---------- 산출물 ---------- */
.deliv-head{display:flex;align-items:center;gap:10px;padding:16px 20px 8px;border-top:1px solid var(--line-soft);margin-top:12px}
.deliv-head h3{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.deliv-list{padding:0 20px 18px;display:flex;flex-direction:column;gap:10px}

.deliv{border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);overflow:hidden}
.deliv.st-완료{border-color:var(--ok)}
.deliv.st-해당없음{opacity:.6}
.deliv-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px}
.deliv-name{font-weight:600;font-size:14px;flex:1;min-width:180px}
.deliv-name small{display:block;font-weight:400;font-size:11.5px;color:var(--muted);margin-top:1px}
.pill{font-size:11px;border-radius:var(--r-pill);padding:2px 9px;border:1px solid transparent;white-space:nowrap}
.pill.req{background:var(--accent-soft);color:var(--accent)}
.pill.opt{background:var(--idle-bg);color:var(--idle)}
.pill.n{background:var(--surface);border-color:var(--line);color:var(--muted)}
.st-sel{font-size:12.5px;padding:4px 8px;border-radius:var(--r-pill);font-weight:600}
.st-sel[data-v="미착수"]{background:var(--idle-bg);color:var(--idle);border-color:var(--idle-bg)}
.st-sel[data-v="진행중"]{background:var(--run-bg);color:var(--run);border-color:var(--run-bg)}
.st-sel[data-v="검토중"]{background:var(--rev-bg);color:var(--rev);border-color:var(--rev-bg)}
.st-sel[data-v="완료"]{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-bg)}
.st-sel[data-v="해당없음"]{background:var(--surface);color:var(--muted)}

.deliv-body{border-top:1px solid var(--line-soft);background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.fields{display:flex;gap:10px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:11px;color:var(--muted)}
.field input{width:150px;font-size:13px;padding:5px 8px}
.field.wide{flex:1;min-width:220px} .field.wide input{width:100%}

/* 링크 */
.links{display:flex;flex-direction:column;gap:5px}
.link-row{display:flex;gap:8px;align-items:center;padding:6px 9px;border:1px solid var(--line-soft);
  border-radius:var(--r-sm);background:var(--surface-2);font-size:13px}
.link-row .lb{font-weight:600;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.link-row .lu{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:11.5px}
.link-row .lu a{text-decoration:none} .link-row .lu a:hover{text-decoration:underline}
.link-row .by{font-size:11px;color:var(--muted);white-space:nowrap}
.link-add{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.link-add input.lab{width:130px;font-size:13px;padding:5px 8px}
.link-add input.url{flex:1;min-width:200px;font-size:13px;padding:5px 8px;font-family:var(--mono)}
.nolink{font-size:12.5px;color:var(--muted);padding:2px 2px 0}

/* ---------- 대시보드 ---------- */
.dash td.pcell{padding:4px 8px;min-width:52px}
.minibar{height:6px;border-radius:var(--r-pill);background:var(--surface-2);overflow:hidden;border:1px solid var(--line-soft)}
.minibar i{display:block;height:100%;background:var(--accent)}
.minibar.full i{background:var(--ok)}
.dash td small{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.dash tr:hover td{background:var(--surface-2)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:600;text-align:left}
.linkbtn:hover{text-decoration:underline}

/* ---------- 모달 ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;place-items:center;z-index:150;padding:20px}
.modal.open{display:grid}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow-2);width:min(520px,100%);max-height:88vh;overflow:auto}
.modal h3{margin:0;padding:16px 20px;border-bottom:1px solid var(--line-soft);font-family:var(--serif);font-size:16px}
.modal .body{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.modal .foot{padding:12px 20px;border-top:1px solid var(--line-soft);display:flex;gap:8px;justify-content:flex-end}
.modal label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
.modal input,.modal select{width:100%}

/* ---------- 토스트 / 배너 ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);
  background:var(--ink);color:var(--ground);padding:9px 16px;border-radius:var(--r-pill);
  font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:180;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.err{background:var(--danger);color:#fff}
.banner{max-width:1400px;margin:12px auto 0;padding:9px 16px;border-radius:var(--r-sm);
  font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--rev-bg);color:var(--rev);border:1px solid var(--rev)}
.banner.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok)}
.banner b{font-weight:600}
.banner span{color:var(--ink-2)}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}

/* ---------- 인쇄 ---------- */
@media print{
  header,nav.toc,.no-print,#toast{display:none !important}
  body{background:#fff}
  .wrap{display:block;max-width:none;padding:0}
  .card,.deliv{box-shadow:none;break-inside:avoid}
  .stage.collapsed .stage-body{display:block !important}
  section.stage{break-inside:avoid-page}
  .link-row .lu{white-space:normal;word-break:break-all}
}
</style>
</head>
<body>
<header>
  <div class="head-in">
    <div class="brand">
      <b>전기공사 프로젝트 표준 프로세스</b>
      <span id="rev">v0.1 · 진행 관리</span>
    </div>

    <div class="seg no-print" id="viewseg">
      <button data-view="track" aria-pressed="true">진행 관리</button>
      <button data-view="dash" aria-pressed="false">전체 현황</button>
    </div>

    <select class="no-print" id="projsel" style="min-width:210px" title="프로젝트 선택"></select>
    <button class="btn no-print" id="btn-newproj">＋ 프로젝트</button>
    <button class="btn ghost no-print" id="btn-editproj" title="프로젝트 수정 / 삭제">✎</button>

    <div class="grow"></div>

    <div class="seg no-print" id="datagrp">
      <button id="btn-export" title="모든 데이터를 JSON 파일로 저장">내보내기</button>
      <button id="btn-import" title="JSON 파일에서 불러오기">불러오기</button>
      <button id="btn-link" title="지정한 JSON 파일에 자동 저장" hidden>파일 연결</button>
    </div>
    <input type="file" id="file-import" accept=".json,application/json" hidden>

    <input type="text" id="who" class="no-print" placeholder="작성자"
           title="등록한 링크에 함께 남길 이름" style="width:104px;font-size:13px;padding:5px 8px">
    <button class="btn ghost no-print" id="btn-collapse" title="모두 접기 / 펼치기">⌄</button>
    <button class="btn ghost no-print" id="btn-print" title="인쇄 / PDF 저장">🖨</button>
    <button class="btn ghost no-print" id="btn-theme" title="라이트/다크">◐</button>
  </div>
</header>

<div id="banner"></div>

<div class="wrap">
  <nav class="toc no-print" id="toc"></nav>
  <main id="main"></main>
</div>

<!-- 새 프로젝트 -->
<div class="modal" id="m-proj">
  <div class="box">
    <h3>프로젝트 등록</h3>
    <div class="body">
      <div><label>프로젝트명 *</label><input type="text" id="p-name" placeholder="예) OO빌딩 로비 LED 전기공사"></div>
      <div><label>발주처</label><input type="text" id="p-client"></div>
      <div><label>현장</label><input type="text" id="p-site"></div>
      <div style="display:flex;gap:10px">
        <div style="flex:1"><label>착수일</label><input type="date" id="p-start"></div>
        <div style="flex:1"><label>준공 목표일</label><input type="date" id="p-target"></div>
      </div>
      <div><label>담당 PM</label><input type="text" id="p-pm"></div>
    </div>
    <div class="foot">
      <button class="btn danger" id="p-del" hidden style="margin-right:auto">프로젝트 삭제</button>
      <button class="btn" data-close>취소</button>
      <button class="btn primary" id="p-save">등록</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';
/* ============================================================
   CONFIG
   ------------------------------------------------------------
   이 파일은 완전한 오프라인 단일 파일이다. 네트워크를 전혀 쓰지 않고
   외부 스크립트·폰트도 불러오지 않으므로, 인터넷이 끊긴 PC 에서
   파일을 더블클릭해 여는 것만으로 동작한다.
   데이터는 이 PC 안에만 저장된다(아래 '저장소' 항목 참고).
   ============================================================ */
const REV = '표준문서 v0.1 · 2026-09-05';
const STATUSES = ['미착수', '진행중', '검토중', '완료', '해당없음'];

/* ============================================================

let toastTimer;
function toast(msg, kind){
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'show' + (kind === 'error' ? ' err' : '');

  toastTimer = setTimeout(() => { el.className = ''; }, 3200);

/* 체크 항목 id 는 위치에서 만든다. 문서 구조가 바뀌면 그 단계의 체크만 초기화된다. */
STAGES.forEach(st => {
  st.checkIds = [];
  st.blocks.forEach((b, bi) => {
    if (b.t === 'check')     b.ids = b.items.map((_, i) => `s${st.n}b${bi}i${i}`);
    if (b.t === 'testcheck') b.ids = b.rows.map((_, i) => `s${st.n}b${bi}i${i}`);
    if (b.ids) st.checkIds.push(...b.ids);
  });
});
const DELIV_BY_ID = {};
STAGES.forEach(st => st.delivs.forEach(d => { DELIV_BY_ID[d.id] = Object.assign({ stage: st.n }, d); }));

/* ============================================================
   State
   ============================================================ */
const state = {
  view: 'track',
  projects: [],       // [{id,name,client,site,startDate,targetDate,pm}]
  pid: '',
  items: {},          // items[pid][itemId] = {status,owner,due,done,note,links:[]}
  who: '',
  collapsed: false,
  editing: '',        // 모달에서 수정 중인 프로젝트 id
  fh: null,           // 연결된 데이터 파일 핸들 (File System Access API)
  fhName: '',
  savedAt: null,      // 파일에 마지막으로 기록한 시각
  dirty: false,       // 파일에 아직 반영되지 않은 변경이 있는가
};

/* ============================================================
   저장소 — 데이터는 이 PC 밖으로 나가지 않는다
   ------------------------------------------------------------
   1) 브라우저 저장소(localStorage) 에 자동 저장. 어떤 브라우저에서도 동작하고
      파일을 다시 열면 그대로 남아 있다. 단, 브라우저 데이터를 지우면 함께 지워진다.
   2) '파일 연결' (Chrome / Edge) — 원하는 위치의 .json 파일을 지정하면
      변경할 때마다 그 파일에도 자동으로 기록한다. 이게 진짜 원본이다.
   3) '내보내기 / 불러오기' — 어느 브라우저에서나 되는 백업·이관 수단.
   ============================================================ */
const LS_KEY   = 'tld_proc_v1';
const DB_NAME  = 'tld_proc_db';
const DB_STORE = 'handles';
const HAS_FS   = typeof window.showSaveFilePicker === 'function';
// file:// 에서 크로미움이 한글 다운로드 파일명을 버리므로 ASCII 로 둔다.
const FILE_NAME = 'TLD-process-tracker.json';

function snapshot(){
  return { app: 'tld-process', v: 1, savedAt: new Date().toISOString(),
           projects: state.projects, items: state.items };
}
function applySnapshot(d){
  state.projects = Array.isArray(d && d.projects) ? d.projects : [];
  state.items    = (d && d.items && typeof d.items === 'object') ? d.items : {};
}

// 파일 핸들을 다음 실행에서도 기억하려고 IndexedDB 에 넣어 둔다.
function idbOpen(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(DB_STORE);
    r.onsuccess = () => res(r.result);
    r.onerror   = () => rej(r.error);
  });
}
async function idbGet(k){
  try {
    const db = await idbOpen();
    return await new Promise((res, rej) => {
      const q = db.transaction(DB_STORE, 'readonly').objectStore(DB_STORE).get(k);
      q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
    });
  } catch (_) { return null; }
}
async function idbSet(k, v){
  try {
    const db = await idbOpen();
    await new Promise((res, rej) => {
      const q = db.transaction(DB_STORE, 'readwrite').objectStore(DB_STORE).put(v, k);
      q.onsuccess = () => res(); q.onerror = () => rej(q.error);
    });
  } catch (_) {}
}

let fileTimer, lsTimer, lsWarned = false;
function writeLS(){
  clearTimeout(lsTimer);
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(snapshot()));
  } catch (e) {
    if (!lsWarned){
      lsWarned = true;
      toast('브라우저 저장에 실패했습니다. 내보내기로 백업해 주세요.', 'error');
    }
  }
}
// 타자 한 글자마다 전체를 직렬화하지 않도록 잠깐 모았다 쓴다.
function persist(){
  clearTimeout(lsTimer);
  lsTimer = setTimeout(writeLS, 300);
  if (state.fh){
    state.dirty = true;
    clearTimeout(fileTimer);
    fileTimer = setTimeout(writeFile, 900);
  }
  paintStatus();
}
// 창을 닫거나 탭을 감출 때는 남은 변경을 바로 기록한다.
window.addEventListener('beforeunload', writeLS);
document.addEventListener('visibilitychange', () => { if (document.hidden) writeLS(); });

async function writeFile(){
  if (!state.fh) return;
  try {
    if (state.fh.queryPermission &&
        (await state.fh.queryPermission({ mode: 'readwrite' })) !== 'granted') return;
    const w = await state.fh.createWritable();
    await w.write(JSON.stringify(snapshot(), null, 2));
    await w.close();
    state.savedAt = new Date();
    state.dirty = false;
  } catch (e) {
    toast('파일 저장 실패: ' + e.message, 'error');
  }
  paintStatus();
}

/* 상단 배너 — 지금 어디에 저장되고 있는지 항상 보여 준다. */
function paintStatus(){
  const t = state.savedAt
    ? state.savedAt.toTimeString().slice(0, 5) + ' 저장됨'
    : '';
  let html;
  if (state.fh){
    html = `<b>파일에 저장 중</b><span>${esc(state.fhName)}` +
           (state.dirty ? ' · 저장 중…' : (t ? ' · ' + t : '')) + '</span>';
  } else {
    html = '<b>이 PC에만 저장됩니다</b><span>브라우저 저장소를 쓰고 있습니다. ' +
      (HAS_FS ? '<b>파일 연결</b>로 원하는 위치의 JSON 파일에 자동 저장하거나, '
              : '') +
      '<b>내보내기</b>로 주기적으로 백업해 주세요.</span>';
  }
  $('#banner').innerHTML = `<div class="banner ${state.fh ? 'ok' : 'warn'} no-print">${html}</div>`;
}

function bucket(pid){
  if (!state.items[pid]) state.items[pid] = {};
  return state.items[pid];
}
function itemOf(pid, id){
  const b = bucket(pid);
  if (!b[id]) b[id] = { status: '미착수', owner: '', due: '', done: '', note: '', links: [] };
  if (!Array.isArray(b[id].links)) b[id].links = [];
  return b[id];
}
function checkSet(pid){
  const it = itemOf(pid, '__checks');
  return new Set(it.links.map(String));
}

/* ============================================================
   데이터 파일 연결 · 내보내기 · 불러오기
   ============================================================ */
async function linkFile(){
  if (!HAS_FS){ toast('이 브라우저는 파일 연결을 지원하지 않습니다. 내보내기를 쓰세요.', 'error'); return; }
  try {
    const fh = await window.showSaveFilePicker({
      suggestedName: FILE_NAME,
      types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }],
    });
    state.fh = fh; state.fhName = fh.name;
    await idbSet('file', fh);
    await writeFile();
    toast('데이터 파일을 연결했습니다. 이제 자동으로 함께 저장됩니다.');
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    toast('파일 연결 실패: ' + e.message, 'error');
  }
}

// 이전에 연결해 둔 파일을 다시 쓰려면 사용자가 한 번 눌러 권한을 줘야 한다.
async function relinkFile(){
  const fh = await idbGet('file');
  if (!fh){ toast('연결해 둔 파일이 없습니다.', 'error'); return; }
  try {
    if (fh.requestPermission &&
        (await fh.requestPermission({ mode: 'readwrite' })) !== 'granted'){
      toast('파일 권한이 거부됐습니다.', 'error'); return;
    }
    const text = await (await fh.getFile()).text();
    const d = JSON.parse(text || '{}');
    state.fh = fh; state.fhName = fh.name;
    if (d.projects) { applySnapshot(d); persist(); }
    afterLoad();
    toast('데이터 파일을 다시 연결했습니다.');
  } catch (e) {
    toast('다시 연결 실패: ' + e.message, 'error');
  }
}

function exportFile(){
  const blob = new Blob([JSON.stringify(snapshot(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = FILE_NAME.replace('.json', '-' + new Date().toISOString().slice(0, 10) + '.json');
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('JSON 파일로 내보냈습니다.');
}

function importFile(file){
  const fr = new FileReader();
  fr.onload = () => {
    let d;
    try { d = JSON.parse(String(fr.result || '{}')); }
    catch (_) { toast('JSON 파일을 읽지 못했습니다.', 'error'); return; }
    if (!d || !Array.isArray(d.projects)){ toast('이 페이지의 데이터 파일이 아닙니다.', 'error'); return; }
    const n = d.projects.length;
    if (!confirm(`불러오면 지금 화면의 데이터가 파일 내용(프로젝트 ${n}건)으로 바뀝니다.\n계속할까요?\n\n※ 먼저 내보내기로 백업해 두는 것을 권합니다.`)) return;
    applySnapshot(d);
    persist();
    afterLoad();
    toast(`프로젝트 ${n}건을 불러왔습니다.`);
  };
  fr.readAsText(file);
}

/* ============================================================
   Load
   ============================================================ */
async function boot(){
  try { state.who = localStorage.getItem('tld_proc_who') || ''; } catch (_) {}
  $('#who').value = state.who;
  $('#rev').textContent = REV;
  if (HAS_FS) $('#btn-link').hidden = false;

  // 1) 브라우저 저장소
  try { applySnapshot(JSON.parse(localStorage.getItem(LS_KEY) || '{}')); } catch (_) {}

  // 2) 지난번에 연결한 파일이 아직 권한을 갖고 있으면 그쪽을 원본으로 삼는다
  if (HAS_FS){
    const fh = await idbGet('file');
    if (fh && fh.queryPermission){
      try {
        if ((await fh.queryPermission({ mode: 'readwrite' })) === 'granted'){
          const d = JSON.parse((await (await fh.getFile()).text()) || '{}');
          state.fh = fh; state.fhName = fh.name;
          if (Array.isArray(d.projects)) applySnapshot(d);
        } else {
          pendingRelink = true;
        }
      } catch (_) {}
    }
  }

  afterLoad();
  paintStatus();
  if (pendingRelink) offerRelink();
}

let pendingRelink = false;
function offerRelink(){
  const b = $('#banner').firstElementChild;
  if (!b) return;
  const btn = document.createElement('button');
  btn.className = 'btn sm';
  btn.style.marginLeft = 'auto';
  btn.textContent = '데이터 파일 다시 연결';
  btn.addEventListener('click', relinkFile);
  b.appendChild(btn);
}

function afterLoad(){
  let last = ''; try { last = localStorage.getItem('tld_proc_pid') || ''; } catch (_) {}
  state.pid = state.projects.some(p => p.id === last)
    ? last : (state.projects[0] ? state.projects[0].id : '');
  paintProjSel();
  render();
}

/* ============================================================
   Save — 변경이 생기면 항목 단위로 기록 시각만 갱신하고 전체를 저장한다
   ============================================================ */
function queueSave(pid, id){
  const it = itemOf(pid, id);
  it.updatedAt = new Date().toISOString();
  it.updatedBy = state.who || '';
  persist();
}

/* ============================================================
   진행률 계산
   ============================================================ */
function stageStat(pid, st){
  const cs = checkSet(pid);
  const checkTotal = st.checkIds.length;
  const checkDone  = st.checkIds.filter(id => cs.has(id)).length;

  let dTotal = 0, dDone = 0, gate = true;
  st.delivs.forEach(d => {
    const s = itemOf(pid, d.id).status;
    if (s === '해당없음') return;
    dTotal++;
    if (s === '완료') dDone++;
    else if (d.req) gate = false;
  });
  const total = checkTotal + dTotal, done = checkDone + dDone;
  if (checkDone < checkTotal) gate = false;
  return { total, done, p: pct(done, total), gate, dTotal, dDone, checkTotal, checkDone };
}
function overallStat(pid){
  let t = 0, d = 0;
  STAGES.forEach(st => { const s = stageStat(pid, st); t += s.total; d += s.done; });
  return { total: t, done: d, p: pct(d, t) };
}

    ? state.projects.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')
    : '<option value="">— 등록된 프로젝트 없음 —</option>';

}

function render(){

  renderTrack();

/* ============================================================
   Render — 진행 관리
   ============================================================ */
function renderTrack(){
  const pid = state.pid;
  const main = $('#main');
  const toc  = $('#toc');

  if (!pid){
    toc.innerHTML = '';
    main.innerHTML = '<div class="card empty">프로젝트가 없습니다.<br>상단 <b>＋ 프로젝트</b> 로 먼저 등록해 주세요.</div>';
    return;
  }

  const proj = state.projects.find(p => p.id === pid) || { name: '' };
  const ov = overallStat(pid);

  // ── 목차
  toc.innerHTML =
    '<h4>단계</h4>' +
    STAGES.map(st => {
      const s = stageStat(pid, st);
      return `<a href="#s${st.n}" data-jump="s${st.n}">
        <span class="toc-row ${s.gate ? 'done' : ''}">
          <i class="toc-no">${st.n}</i><span style="flex:1">${esc(st.title)}</span>
          <span class="toc-pc">${s.p}%</span>
        </span></a>`;
    }).join('') +
    '<hr><h4>참고</h4>' +
    '<a href="#ref-roles" data-jump="ref-roles">역할 분담</a>' +
    '<a href="#ref-risk" data-jump="ref-risk">리스크 Top 7</a>' +
    '<a href="#ref-master" data-jump="ref-master">문서 마스터 체크리스트</a>';

  // ── 본문
  main.innerHTML =
    projHeader(proj, ov) +
    STAGES.map(st => stageHTML(pid, st)).join('') +
    refHTML(pid);
}

function projHeader(proj, ov){
  const meta = [
    ['발주처', proj.client], ['현장', proj.site],
    ['착수', proj.startDate], ['준공 목표', proj.targetDate], ['PM', proj.pm],
  ].filter(x => x[1]).map(x => `<span><b>${esc(x[0])}</b>${esc(x[1])}</span>`).join('');

  return `<div class="card pad" style="margin-bottom:20px">
    <div class="projbar">
      <div style="flex:1;min-width:220px">
        <div style="font-family:var(--serif);font-size:19px;font-weight:600">${esc(proj.name)}</div>
        <div class="meta" style="margin-top:5px">${meta || '<span style="color:var(--muted)">부가 정보 없음</span>'}</div>
      </div>
      <div style="text-align:right">
        <div style="font-family:var(--mono);font-size:26px;line-height:1">${ov.p}<span style="font-size:14px">%</span></div>
        <div style="font-size:11.5px;color:var(--muted)">${ov.done} / ${ov.total} 항목</div>
      </div>
    </div>
    <div class="bigbar ${ov.p === 100 ? 'full' : ''}"><i style="width:${ov.p}%"></i></div>
  </div>`;
}

function stageHTML(pid, st){
  const s = stageStat(pid, st);
  const cs = checkSet(pid);

  const blocks = st.blocks.map(b => {
    if (b.t === 'note'){
      return `<div class="block note"><h3>${esc(b.h)}</h3><ul>${b.items.map(i => `<li>${i}</li>`).join('')}</ul></div>`;
    }
    if (b.t === 'table'){
      return `<div class="block"><h3>${esc(b.h)}</h3><div class="scrollx"><table class="tbl">
        <thead><tr>${b.head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
        <tbody>${b.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div></div>`;
    }
    if (b.t === 'testcheck'){
      return `<div class="block"><h3>${esc(b.h)}</h3><div class="scrollx"><table class="tbl">
        <thead><tr>${b.head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
        <tbody>${b.rows.map((r, i) => {
          const id = b.ids[i];
          return `<tr>
            <td class="c"><input type="checkbox" class="ckbox" data-ck="${id}" ${cs.has(id) ? 'checked' : ''}
              style="width:15px;height:15px;accent-color:var(--accent);cursor:pointer"></td>
            <td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td>${r[2]}</td>
          </tr>`;
        }).join('')}</tbody>
      </table></div></div>`;
    }
    return `<div class="block"><h3>${esc(b.h)}</h3>${b.items.map((txt, i) => {
      const id = b.ids[i];
      return `<label class="chk"><input type="checkbox" class="ckbox" data-ck="${id}" ${cs.has(id) ? 'checked' : ''}><span>${txt}</span></label>`;
    }).join('')}</div>`;
  }).join('');

  return `<section class="stage card ${s.gate ? 'done' : ''}" id="s${st.n}">
    <div class="stage-head" data-toggle>
      <div class="stage-no">${st.n}</div>
      <div class="stage-title">
        <h2>${esc(st.title)}</h2>
        <p>${esc(st.q)}</p>
      </div>
      <div class="stage-pc">${s.done}/${s.total} · ${s.p}%</div>
      <div class="chev">⌄</div>
    </div>
    <div class="stage-body">
      <div class="gate ${s.gate ? 'pass' : ''}">
        <span class="tag">Gate</span><b>${esc(st.gate)}</b>
        <span style="color:var(--muted)">${s.gate ? '— 통과' : '— 미통과 (필수 산출물·체크 완료 필요)'}</span>
      </div>
      <p class="purpose"><b>목적</b> · ${esc(st.purpose)}</p>
      ${blocks}
      <div class="deliv-head"><h3>산출물 · 링크 등록</h3>
        <span style="font-size:11.5px;color:var(--muted)">${s.dDone}/${s.dTotal} 완료</span></div>
      <div class="deliv-list">${st.delivs.map(d => delivHTML(pid, d)).join('')}</div>
    </div>
  </section>`;
}

function delivHTML(pid, d){
  const it = itemOf(pid, d.id);
  const links = it.links.map((l, i) => {
    const u = String(l.url || '');
    const target = isWeb(u)
      ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`
      : `${esc(u)}`;
    return `<div class="link-row">
      <span class="lb">${esc(l.label || '문서')}</span>
      <span class="lu">${target}</span>
      ${l.by ? `<span class="by">${esc(l.by)}</span>` : ''}
      <button class="btn sm ghost no-print copy" data-url="${esc(u)}" title="주소 복사">복사</button>
      <button class="btn sm ghost danger no-print del-link" data-id="${d.id}" data-i="${i}" title="삭제">✕</button>
    </div>`;
  }).join('');

  return `<div class="deliv st-${esc(it.status)}" data-deliv="${d.id}">
    <div class="deliv-top">
      <div class="deliv-name">${esc(d.name)}${d.hint ? `<small>${esc(d.hint)}</small>` : ''}</div>
      <span class="pill ${d.req ? 'req' : 'opt'}">${d.req ? '필수' : '권장'}</span>
      <span class="pill n">${esc(d.by)}</span>
      <span class="pill n">링크 ${it.links.length}</span>
      <select class="st-sel" data-f="status" data-id="${d.id}" data-v="${esc(it.status)}">
        ${STATUSES.map(s => `<option ${s === it.status ? 'selected' : ''}>${s}</option>`).join('')}
      </select>
    </div>
    <div class="deliv-body">
      <div class="links">${links || '<div class="nolink">등록된 링크가 없습니다. 아래에 사내 서버/드라이브 주소를 붙여 넣으세요.</div>'}</div>
      <div class="link-add no-print">
        <input type="text" class="lab" placeholder="문서명 (예: Rev.2)">
        <input type="text" class="url" placeholder="https://…  또는  \\\\nas\\projects\\…">
        <button class="btn sm primary add-link" data-id="${d.id}">＋ 링크 추가</button>
      </div>
      <div class="fields">
        <div class="field"><label>담당자</label>
          <input type="text" class="fld" data-f="owner" data-id="${d.id}" value="${esc(it.owner)}"></div>
        <div class="field"><label>기한</label>
          <input type="date" class="fld" data-f="due" data-id="${d.id}" value="${esc(it.due)}"></div>
        <div class="field"><label>완료일</label>
          <input type="date" class="fld" data-f="done" data-id="${d.id}" value="${esc(it.done)}"></div>
        <div class="field wide"><label>비고</label>
          <input type="text" class="fld" data-f="note" data-id="${d.id}" value="${esc(it.note)}"></div>
      </div>
      ${it.updatedAt ? `<div style="font-size:11px;color:var(--muted)">최종 수정 ${esc(String(it.updatedAt).slice(0,16).replace('T',' '))} · ${esc(it.updatedBy || '')}</div>` : ''}
    </div>
  </div>`;
}

   Render — 전체 현황

  if (!state.projects.length){
    $('#main').innerHTML = '<div class="card empty">등록된 프로젝트가 없습니다.</div>';
    return;
  }

  const rows = state.projects.map(p => {
    const ov = overallStat(p.id);
    const cells = STAGES.map(st => {
      const s = stageStat(p.id, st);
      return `<td class="pcell" title="${esc(st.title)} — ${s.done}/${s.total}">
        <div class="minibar ${s.gate ? 'full' : ''}"><i style="width:${s.p}%"></i></div>
        <small>${s.p}%</small></td>`;
    }).join('');
    return `<tr>
      <td><button class="linkbtn" data-open="${esc(p.id)}">${esc(p.name)}</button>
        <div style="font-size:11px;color:var(--muted)">${esc([p.client, p.site].filter(Boolean).join(' · '))}</div></td>
      ${cells}
      <td class="pcell" style="min-width:80px">
        <div class="minibar ${ov.p === 100 ? 'full' : ''}"><i style="width:${ov.p}%"></i></div>
        <small>${ov.p}% · ${ov.done}/${ov.total}</small></td>
      <td style="white-space:nowrap;font-size:12px;color:var(--muted)">${esc(p.targetDate || '')}</td>
    </tr>`;
  }).join('');

  $('#main').innerHTML = `<div class="card">
    <div class="pad" style="border-bottom:1px solid var(--line-soft)">
      <div style="font-family:var(--serif);font-size:18px;font-weight:600">전체 현황</div>
      <div style="font-size:12.5px;color:var(--muted);margin-top:3px">

      <div style="font-size:11.5px;color:var(--muted);margin-top:6px">${STAGES.map(st => `<span style="margin-right:12px"><b style="font-family:var(--mono)">${st.n}</b> ${esc(st.title)}</span>`).join('')}</div>
    </div>
    <div class="scrollx"><table class="tbl dash" style="min-width:900px">
      <thead><tr><th style="min-width:200px">프로젝트</th>
        ${STAGES.map(st => `<th class="c" title="${esc(st.title)}">${st.n}</th>`).join('')}
        <th>전체</th><th>준공 목표</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>

}

/* ============================================================
   부분 갱신 — 입력 중 포커스가 날아가지 않도록 전체 렌더를 피한다
   ============================================================ */
function refreshProgress(){
  const pid = state.pid;
  if (!pid || state.view !== 'track') return;

  STAGES.forEach(st => {
    const s = stageStat(pid, st);
    const sec = document.getElementById('s' + st.n);
    if (sec){
      sec.classList.toggle('done', s.gate);
      const pcEl = sec.querySelector('.stage-pc');
      if (pcEl) pcEl.textContent = `${s.done}/${s.total} · ${s.p}%`;
      const gate = sec.querySelector('.gate');
      if (gate){
        gate.classList.toggle('pass', s.gate);
        gate.lastElementChild.textContent = s.gate ? '— 통과' : '— 미통과 (필수 산출물·체크 완료 필요)';
      }
      const dh = sec.querySelector('.deliv-head span');
      if (dh) dh.textContent = `${s.dDone}/${s.dTotal} 완료`;
    }
    const link = document.querySelector(`#toc a[data-jump="s${st.n}"]`);
    if (link){
      link.querySelector('.toc-row').classList.toggle('done', s.gate);
      link.querySelector('.toc-pc').textContent = s.p + '%';
    }
  });

  const ov = overallStat(pid);
  const head = $('#main .card .projbar');
  if (head){
    const box = head.lastElementChild;
    box.children[0].innerHTML = `${ov.p}<span style="font-size:14px">%</span>`;
    box.children[1].textContent = `${ov.done} / ${ov.total} 항목`;
    const bar = $('#main .bigbar');
    bar.classList.toggle('full', ov.p === 100);
    bar.firstElementChild.style.width = ov.p + '%';
  }
}

function refreshDeliv(id){
  const el = document.querySelector(`.deliv[data-deliv="${id}"]`);
  if (!el) return;
  const d = DELIV_BY_ID[id];
  el.outerHTML = delivHTML(state.pid, d);
  refreshProgress();
}

/* ============================================================
   Events
   ============================================================ */
function bindEvents(){
  // ── 뷰 전환
  $('#viewseg').addEventListener('click', e => {
    const b = e.target.closest('button[data-view]');
    if (!b) return;
    state.view = b.dataset.view;
    $$('#viewseg button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    render();
  });

  // ── 프로젝트 선택
  $('#projsel').addEventListener('change', e => {
    state.pid = e.target.value;
    try { localStorage.setItem('tld_proc_pid', state.pid); } catch (_) {}
    render();
  });

  // ── 작성자
  $('#who').addEventListener('input', e => {
    state.who = e.target.value.trim();
    try { localStorage.setItem('tld_proc_who', state.who); } catch (_) {}
  });

  // ── 도구
  $('#btn-print').addEventListener('click', () => window.print());
  $('#btn-collapse').addEventListener('click', () => {
    state.collapsed = !state.collapsed;
    $$('#main section.stage').forEach(s => s.classList.toggle('collapsed', state.collapsed));
    $('#btn-collapse').textContent = state.collapsed ? '⌃' : '⌄';
  });
  $('#btn-theme').addEventListener('click', () => {
    const cur = document.documentElement.dataset.theme
      || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('tld_theme', next); } catch (_) {}
  });

  // ── 목차
  $('#toc').addEventListener('click', e => {
    const sw = e.target.closest('[data-view-switch]');
    if (sw){
      e.preventDefault();
      state.view = sw.dataset.viewSwitch;
      $$('#viewseg button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.view === state.view)));
      render();
      return;
    }
    const a = e.target.closest('a[data-jump]');
    if (!a) return;
    const sec = document.getElementById(a.dataset.jump);
    if (sec) sec.classList.remove('collapsed');
  });

  // ── 본문 (위임)
  const main = $('#main');

  main.addEventListener('click', e => {
    // 대시보드에서 프로젝트 열기
    const open = e.target.closest('[data-open]');
    if (open){
      state.pid = open.dataset.open;
      state.view = 'track';
      $$('#viewseg button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.view === 'track')));
      $('#projsel').value = state.pid;
      try { localStorage.setItem('tld_proc_pid', state.pid); } catch (_) {}
      render();
      return;
    }
    // 단계 접기/펼치기
    const th = e.target.closest('.stage-head[data-toggle]');
    if (th && !e.target.closest('input,select,button')){
      th.parentElement.classList.toggle('collapsed');
      return;
    }
    // 링크 추가
    const add = e.target.closest('.add-link');
    if (add){ addLink(add); return; }
    // 링크 삭제
    const del = e.target.closest('.del-link');
    if (del){
      const it = itemOf(state.pid, del.dataset.id);
      const l = it.links[Number(del.dataset.i)];
      if (!l) return;
      if (!confirm(`링크를 삭제할까요?\n\n${l.label || ''}\n${l.url || ''}`)) return;
      it.links.splice(Number(del.dataset.i), 1);
      queueSave(state.pid, del.dataset.id);
      refreshDeliv(del.dataset.id);
      toast('링크를 삭제했습니다.');
      return;
    }
    // 주소 복사
    const cp = e.target.closest('.copy');
    if (cp){ copyText(cp.dataset.url); return; }
  });

  // Enter 로도 링크 추가
  main.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const box = e.target.closest('.link-add');
    if (!box) return;
    e.preventDefault();
    addLink(box.querySelector('.add-link'));
  });

  // 체크박스
  main.addEventListener('change', e => {
    const ck = e.target.closest('.ckbox');
    if (ck){
      const it = itemOf(state.pid, '__checks');
      const set = new Set(it.links.map(String));
      if (ck.checked) set.add(ck.dataset.ck); else set.delete(ck.dataset.ck);
      it.links = Array.from(set);
      it.status = '진행중';
      queueSave(state.pid, '__checks');
      refreshProgress();
      return;
    }
    const sel = e.target.closest('.st-sel');
    if (sel){
      const it = itemOf(state.pid, sel.dataset.id);
      it.status = sel.value;
      sel.dataset.v = sel.value;
      const card = sel.closest('.deliv');
      card.className = 'deliv st-' + sel.value;
      // 완료로 바꾸면 완료일이 비어 있을 때만 오늘로 채운다
      if (sel.value === '완료' && !it.done){
        it.done = new Date().toISOString().slice(0, 10);
        const di = card.querySelector('.fld[data-f="done"]');
        if (di) di.value = it.done;
      }
      queueSave(state.pid, sel.dataset.id);
      refreshProgress();
    }
  });

  // 텍스트/날짜 필드
  main.addEventListener('input', e => {
    const f = e.target.closest('.fld');
    if (!f) return;
    const it = itemOf(state.pid, f.dataset.id);
    it[f.dataset.f] = f.value;
    queueSave(state.pid, f.dataset.id);
  });

  // ── 프로젝트 모달
  $('#btn-newproj').addEventListener('click', () => openProjModal(''));
  $('#btn-editproj').addEventListener('click', () => {
    if (!state.pid){ toast('먼저 프로젝트를 등록해 주세요.', 'error'); return; }
    openProjModal(state.pid);
  });
  $('#p-del').addEventListener('click', deleteProject);

  // ── 데이터 파일
  $('#btn-export').addEventListener('click', exportFile);
  $('#btn-import').addEventListener('click', () => $('#file-import').click());
  $('#file-import').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if (f) importFile(f);
    e.target.value = '';
  });
  $('#btn-link').addEventListener('click', linkFile);
  $('#m-proj').addEventListener('click', e => {
    if (e.target.id === 'm-proj' || e.target.hasAttribute('data-close')) $('#m-proj').classList.remove('open');
  });
  $('#p-save').addEventListener('click', saveProject);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') $('#m-proj').classList.remove('open');
  });
}

function addLink(btn){
  const box = btn.closest('.link-add');
  const id  = btn.dataset.id;
  const lab = box.querySelector('.lab').value.trim();
  const url = box.querySelector('.url').value.trim();

  if (!url){ toast('링크 주소를 입력해 주세요.', 'error'); box.querySelector('.url').focus(); return; }
  if (/^\s*javascript:/i.test(url)){ toast('허용되지 않는 주소입니다.', 'error'); return; }

  const it = itemOf(state.pid, id);
  it.links.push({
    id: uid(), label: lab || '문서', url,
    by: state.who || '', at: new Date().toISOString().slice(0, 10),
  });
  if (it.status === '미착수') it.status = '진행중';
  queueSave(state.pid, id);
  refreshDeliv(id);
  toast('링크를 등록했습니다.');
}

function copyText(t){
  const done = () => toast('주소를 복사했습니다.');
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(t).then(done, () => toast('복사 실패', 'error'));
    return;
  }
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (_) { toast('복사 실패', 'error'); }
  document.body.removeChild(ta);
}

function openProjModal(pid){
  state.editing = pid || '';
  const p = pid ? (state.projects.find(x => x.id === pid) || {}) : {};
  $('#p-name').value   = p.name || '';
  $('#p-client').value = p.client || '';
  $('#p-site').value   = p.site || '';
  $('#p-start').value  = p.startDate || '';
  $('#p-target').value = p.targetDate || '';
  $('#p-pm').value     = p.pm || '';
  $('#m-proj').querySelector('h3').textContent = pid ? '프로젝트 수정' : '프로젝트 등록';
  $('#p-save').textContent = pid ? '저장' : '등록';
  $('#p-del').hidden = !pid;
  $('#m-proj').classList.add('open');
  $('#p-name').focus();
}

function saveProject(){
  const name = $('#p-name').value.trim();
  if (!name){ toast('프로젝트명을 입력해 주세요.', 'error'); return; }

  const fields = {
    name: name,
    client: $('#p-client').value.trim(),
    site: $('#p-site').value.trim(),
    startDate: $('#p-start').value,
    targetDate: $('#p-target').value,
    pm: $('#p-pm').value.trim(),
  };

  if (state.editing){
    const p = state.projects.find(x => x.id === state.editing);
    if (!p){ toast('프로젝트를 찾을 수 없습니다.', 'error'); return; }
    Object.assign(p, fields);
  } else {
    const p = Object.assign({ id: uid(), createdAt: new Date().toISOString(), createdBy: state.who || '' }, fields);
    state.projects.push(p);
    state.pid = p.id;
    try { localStorage.setItem('tld_proc_pid', state.pid); } catch (_) {}
  }

  persist();
  $('#m-proj').classList.remove('open');
  paintProjSel();
  state.view = 'track';
  $$('#viewseg button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.view === 'track')));
  render();
  toast(state.editing ? '프로젝트를 수정했습니다.' : '프로젝트를 등록했습니다.');
  state.editing = '';
}

// 프로젝트와 그 진행 기록을 함께 지운다. 되돌릴 수 없으니 이름을 확인시킨다.
function deleteProject(){
  const pid = state.editing;
  const p = state.projects.find(x => x.id === pid);
  if (!p) return;
  if (!confirm(`「${p.name}」 프로젝트와 그 안의 체크·산출물·링크를 모두 지웁니다.\n되돌릴 수 없습니다. 계속할까요?`)) return;

  state.projects = state.projects.filter(x => x.id !== pid);
  delete state.items[pid];
  state.editing = '';
  state.pid = state.projects[0] ? state.projects[0].id : '';
  try { localStorage.setItem('tld_proc_pid', state.pid); } catch (_) {}

  persist();
  $('#m-proj').classList.remove('open');
  paintProjSel();
  render();
  toast('프로젝트를 삭제했습니다.');
}

/* ============================================================
   Init
   ============================================================ */
(function init(){
  try {
    const t = localStorage.getItem('tld_theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (_) {}
  bindEvents();
  boot();
})();
</script>
</body>
</html>
